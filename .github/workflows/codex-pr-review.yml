name: Codex PR review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the pull request head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --depth=1 origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-head"

      - name: Collect PR metadata and current checks
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const prNumber = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const [checks, status] = await Promise.all([
              github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              }),
              github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: pr.head.sha,
              }),
            ]);

            const lines = [
              "# PR metadata (untrusted data)",
              "",
              `- Number: #${pr.number}`,
              `- Base: ${pr.base.ref} @ ${pr.base.sha}`,
              `- Head: ${pr.head.ref} @ ${pr.head.sha}`,
              `- Author: ${pr.user.login}`,
              `- Title: ${pr.title || "(none)"}`,
              "",
              "## PR body (untrusted data)",
              "",
              pr.body || "(none)",
              "",
              "## Check runs available when this review started",
              "",
              ...(checks.data.check_runs.length
                ? checks.data.check_runs.map((check) =>
                    `- ${check.name}: ${check.status}${check.conclusion ? ` / ${check.conclusion}` : ""}`
                  )
                : ["- None reported."]),
              "",
              "## Legacy commit statuses available when this review started",
              "",
              ...(status.data.statuses.length
                ? status.data.statuses.map((item) =>
                    `- ${item.context}: ${item.state}${item.description ? ` — ${item.description}` : ""}`
                  )
                : ["- None reported."]),
            ];

            fs.mkdirSync(".codex-review", { recursive: true });
            fs.writeFileSync(".codex-review/context.md", lines.join("\n"));

      - name: Run Codex review
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/pr-review.md
          permission-profile: ":read-only"
          safety-strategy: drop-sudo

  publish:
    name: Publish review
    needs: review
    if: ${{ always() && needs.review.result == 'success' && needs.review.outputs.final_message != '' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Create or update the review comment
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ needs.review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = "<!-- codex-pr-review -->";
            const body = `${marker}\n${process.env.REVIEW}`;
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const previous = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }
